<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgian Verb Corpus Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen" x-data="app()" x-init="init()">

    <header class="bg-white shadow border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-indigo-600">Georgian Verb Corpus</h1>
            <span class="text-xs text-gray-500 capitalize" x-text="profile ? 'Role: ' + profile.role : ''"></span>
        </div>
        <template x-if="user">
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-600" x-text="user.email"></span>
                <button @click="logout()" class="text-sm bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200">Logout</button>
            </div>
        </template>
    </header>

    <main class="max-w-5xl mx-auto p-6">

        <!-- LOGIN VIEW -->
        <template x-if="!user">
            <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow border border-gray-200 mt-12">
                <h2 class="text-2xl font-semibold mb-6 text-center">Login</h2>
                <form @submit.prevent="login()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" x-model="email" required class="mt-1 w-full p-2 border rounded border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" x-model="password" required class="mt-1 w-full p-2 border rounded border-gray-300">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 font-medium">Sign In</button>
                    <p class="text-red-500 text-sm mt-2 text-center" x-text="errorMessage"></p>
                </form>
            </div>
        </template>

        <!-- MAIN APP VIEW -->
        <template x-if="user">
        <div>
            <!-- NAVIGATION TABS -->
            <div class="flex space-x-6 border-b border-gray-200 mb-6 pb-2 overflow-x-auto">
                <button @click="currentTab = 'stats'; fetchStats()" :class="currentTab === 'stats' ? 'border-indigo-600 text-indigo-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Dashboard</button>
                <button @click="currentTab = 'write'" :class="currentTab === 'write' ? 'border-indigo-600 text-indigo-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Writing Tasks</button>
                <button @click="currentTab = 'record'" :class="currentTab === 'record' ? 'border-indigo-600 text-indigo-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Recording Tasks</button>
                
                <template x-if="profile && profile.role === 'admin'">
                    <div class="flex space-x-6 border-l pl-6 border-gray-300">
                        <button @click="currentTab = 'admin_assign'; fetchAdminData()" :class="currentTab === 'admin_assign' ? 'border-purple-600 text-purple-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Admin: Forms & Assign</button>
                        <button @click="currentTab = 'admin_review_audio'; fetchAdminRecordings()" :class="currentTab === 'admin_review_audio' ? 'border-purple-600 text-purple-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Admin: Review Recordings</button>
                        <button @click="currentTab = 'admin_flags'; fetchAdminFlags()" :class="currentTab === 'admin_flags' ? 'border-red-600 text-red-600 font-bold' : 'text-gray-500'" class="pb-2 border-b-2 whitespace-nowrap">Admin: Flagged Items</button>
                    </div>
                </template>
            </div>

            <!-- STATS TAB -->
            <template x-if="currentTab === 'stats'">
                <div class="space-y-6 max-w-3xl mx-auto">
                    <h3 class="text-xl font-bold text-gray-800">Your Activity Dashboard</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Writing Stats Breakdown -->
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 space-y-4">
                            <h4 class="font-bold text-indigo-600 border-b pb-2 flex justify-between items-center">
                                <span>Writing Tasks</span>
                                <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded" x-text="'Total: ' + (stats.wAssigned + stats.wSubmitted + stats.wApproved + stats.wFlagged)"></span>
                            </h4>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between p-2 bg-gray-50 rounded">
                                    <span class="text-gray-600">Assigned (Pending):</span>
                                    <span class="font-bold text-gray-800" x-text="stats.wAssigned">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-blue-50 rounded">
                                    <span class="text-blue-700">Submitted (Complete):</span>
                                    <span class="font-bold text-blue-800" x-text="stats.wSubmitted">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-emerald-50 rounded">
                                    <span class="text-emerald-700">Approved:</span>
                                    <span class="font-bold text-emerald-800" x-text="stats.wApproved">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-red-50 rounded">
                                    <span class="text-red-700">Flagged:</span>
                                    <span class="font-bold text-red-800" x-text="stats.wFlagged">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Recording Stats Breakdown -->
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 space-y-4">
                            <h4 class="font-bold text-emerald-600 border-b pb-2 flex justify-between items-center">
                                <span>Recording Tasks</span>
                                <span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded" x-text="'Total: ' + (stats.rAssigned + stats.rSubmitted + stats.rApproved + stats.rFlagged)"></span>
                            </h4>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between p-2 bg-gray-50 rounded">
                                    <span class="text-gray-600">Assigned (Pending):</span>
                                    <span class="font-bold text-gray-800" x-text="stats.rAssigned">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-blue-50 rounded">
                                    <span class="text-blue-700">Submitted (Complete):</span>
                                    <span class="font-bold text-blue-800" x-text="stats.rSubmitted">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-emerald-50 rounded">
                                    <span class="text-emerald-700">Approved:</span>
                                    <span class="font-bold text-emerald-800" x-text="stats.rApproved">0</span>
                                </div>
                                <div class="flex justify-between p-2 bg-red-50 rounded">
                                    <span class="text-red-700">Flagged:</span>
                                    <span class="font-bold text-red-800" x-text="stats.rFlagged">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- WRITING TAB -->
            <template x-if="currentTab === 'write'">
                <div class="space-y-6 max-w-4xl mx-auto" x-data="{ expandedFormId: null, exampleInputs: {}, flagModalOpen: false, activeFormObj: null, flagComment: '' }">
                    <h3 class="text-xl font-bold text-gray-800">Assigned Writing Tasks</h3>
                    
                    <!-- LEVEL 1: Masdar Main Heading -->
                    <template x-for="masdarGroup in writingTasks" :key="masdarGroup.masdar">
                        <div class="space-y-4 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h2 class="text-2xl font-bold text-indigo-600 border-b pb-2" x-text="'Masdar: ' + masdarGroup.masdar"></h2>
                            
                            <!-- LEVEL 2: Screeve Subheading -->
                            <template x-for="screeveGroup in masdarGroup.screeves" :key="screeveGroup.screeve">
                                <div class="space-y-3 pl-4 border-l-2 border-indigo-100">
                                    <h3 class="text-lg font-semibold text-gray-700 capitalize" x-text="'Screeve: ' + screeveGroup.screeve"></h3>
                                    
                                    <!-- LEVEL 3: Form Sub-sub-heading (Sorted by Subject, then Object) -->
                                    <div class="space-y-2 pl-4">
                                        <template x-for="item in screeveGroup.forms" :key="item.formObj.id">
                                            <div class="border rounded-lg bg-gray-50 overflow-hidden">
                                                <!-- Form Card Header (Click to expand) -->
                                                <div @click="expandedFormId = expandedFormId === item.formObj.id ? null : item.formObj.id" class="p-3.5 cursor-pointer hover:bg-gray-100 flex justify-between items-center transition">
                                                    <div class="flex items-center space-x-4 text-sm">
                                                        <span class="font-bold text-indigo-700" x-text="item.formObj.form"></span>
                                                        <span class="text-gray-500" x-text="'Subj: ' + (item.formObj.subject || 'N/A')"></span>
                                                        <span class="text-gray-500" x-text="'Obj: ' + (item.formObj.object || 'N/A')"></span>
                                                        <span class="text-xs px-2 py-0.5 rounded uppercase font-medium" :class="item.formObj.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : (item.formObj.status === 'flagged' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800')" x-text="item.formObj.status"></span>
                                                    </div>
                                                    <span class="text-gray-400 text-xs font-medium" x-text="expandedFormId === item.formObj.id ? '▲ Collapse' : '▼ Expand'"></span>
                                                </div>

                                                <!-- Form Card Body (Review flow & 3 Sentence Inputs) -->
                                                <template x-if="expandedFormId === item.formObj.id">
                                                    <div class="p-4 border-t border-gray-200 bg-white space-y-4">
                                                        
                                                        <!-- STEP 1: Form Review (Approve / Flag) -->
                                                        <template x-if="item.formObj.status === 'assigned'">
                                                            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded space-y-2">
                                                                <p class="text-xs font-bold text-blue-900 uppercase">Step 1: Review Base Form Metadata</p>
                                                                <p class="text-xs text-blue-800">Check if this specific form variant is correct before writing sentences.</p>
                                                                <div class="flex space-x-3 pt-1">
                                                                    <button @click="approveForm(item.formObj)" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs hover:bg-emerald-700 font-medium">Approve Form</button>
                                                                    <button @click="openFlagModal(item.formObj)" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs hover:bg-red-700 font-medium">Flag Form as Incorrect</button>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <!-- STEP 2: Write 3 Example Sentences Linked to form.id -->
                                                        <template x-if="item.formObj.status === 'approved'">
                                                            <div class="space-y-3 pt-2">
                                                                <p class="text-xs font-bold text-indigo-900 uppercase">Step 2: Write 3 Example Sentences</p>
                                                                <div class="text-xs text-indigo-800 space-y-1">
                                                                    <p>• Must contain target form: <code class="bg-indigo-100 px-1 py-0.5 rounded text-indigo-900 font-bold" x-text="item.formObj.form"></code></p>
                                                                    <p>• Must end with a punctuation mark (. ! ?).</p>
                                                                </div>

                                                                <div class="space-y-2">
                                                                    <div>
                                                                        <label class="block text-xs font-medium text-gray-700 mb-0.5">Example 1</label>
                                                                        <input type="text" x-model="exampleInputs[item.formObj.id + '_0']" placeholder="დაწერეთ პირველი მაგალითი..." class="w-full p-2 border rounded border-gray-300 text-sm">
                                                                    </div>
                                                                    <div>
                                                                        <label class="block text-xs font-medium text-gray-700 mb-0.5">Example 2</label>
                                                                        <input type="text" x-model="exampleInputs[item.formObj.id + '_1']" placeholder="დაწერეთ მეორე მაგალითი..." class="w-full p-2 border rounded border-gray-300 text-sm">
                                                                    </div>
                                                                    <div>
                                                                        <label class="block text-xs font-medium text-gray-700 mb-0.5">Example 3</label>
                                                                        <input type="text" x-model="exampleInputs[item.formObj.id + '_2']" placeholder="დაწერეთ მესამე მაგალითი..." class="w-full p-2 border rounded border-gray-300 text-sm">
                                                                    </div>
                                                                </div>

                                                                <button @click="submitSentences(item)" class="w-full bg-indigo-600 text-white py-2 rounded text-sm hover:bg-indigo-700 font-medium">Submit All 3 Sentences</button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <p x-show="writingTasks.length === 0" class="text-gray-500 italic text-center py-6">No pending writing tasks assigned right now.</p>

                    <!-- FLAG MODAL POPUP -->
                    <div x-show="flagModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4">
                            <h4 class="text-lg font-bold text-red-600">Flag Form as Incorrect</h4>
                            <p class="text-sm text-gray-600">Please leave a comment explaining why this form is being flagged:</p>
                            <textarea x-model="flagComment" rows="3" placeholder="Enter reason for flagging..." class="w-full p-2 border rounded border-gray-300 text-sm"></textarea>
                            <div class="flex justify-end space-x-3">
                                <button @click="flagModalOpen = false; flagComment = ''" class="px-4 py-2 border rounded text-sm text-gray-600 hover:bg-gray-100">Cancel</button>
                                <button @click="submitFlagForm()" class="px-4 py-2 bg-red-600 text-white rounded text-sm hover:bg-red-700 font-medium">Submit Flag</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- RECORDING TAB -->
            <template x-if="currentTab === 'record'">
                <div class="space-y-6 max-w-4xl mx-auto" x-data="{ expandedRecId: null, flagModalOpen: false, activeRecObj: null, flagComment: '' }">
                    <h3 class="text-xl font-bold text-gray-800">Assigned Recording Tasks</h3>
                    
                    <!-- LEVEL 1: Masdar Main Heading -->
                    <template x-for="masdarGroup in recordingTasks" :key="masdarGroup.masdar">
                        <div class="space-y-4 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h2 class="text-2xl font-bold text-emerald-600 border-b pb-2" x-text="'Masdar: ' + masdarGroup.masdar"></h2>
                            
                            <!-- LEVEL 2: Screeve Subheading -->
                            <template x-for="screeveGroup in masdarGroup.screeves" :key="screeveGroup.screeve">
                                <div class="space-y-3 pl-4 border-l-2 border-emerald-100">
                                    <h3 class="text-lg font-semibold text-gray-700 capitalize" x-text="'Screeve: ' + screeveGroup.screeve"></h3>
                                    
                                    <!-- LEVEL 3: Form Sub-sub-heading -->
                                    <div class="space-y-2 pl-4">
                                        <template x-for="item in screeveGroup.forms" :key="item.formObj.id">
                                            <div class="space-y-2">
                                                <template x-for="rec in item.recordings" :key="rec.id">
                                                    <div class="border rounded-lg bg-gray-50 overflow-hidden">
                                                        <!-- Card Header -->
                                                        <div @click="expandedRecId = expandedRecId === rec.id ? null : rec.id" class="p-3.5 cursor-pointer hover:bg-gray-100 flex justify-between items-center transition">
                                                            <div class="flex items-center space-x-4 text-sm">
                                                                <span class="font-bold text-emerald-700" x-text="item.formObj.form"></span>
                                                                <span class="text-gray-500" x-text="'Subj: ' + (item.formObj.subject || 'N/A')"></span>
                                                                <span class="text-gray-500" x-text="'Obj: ' + (item.formObj.object || 'N/A')"></span>
                                                                <span class="text-xs px-2 py-0.5 rounded uppercase font-medium" :class="rec.sentence.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : (rec.sentence.status === 'flagged' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800')" x-text="'Sentence: ' + rec.sentence.status"></span>
                                                            </div>
                                                            <span class="text-gray-400 text-xs font-medium" x-text="expandedRecId === rec.id ? '▲ Collapse' : '▼ Expand'"></span>
                                                        </div>

                                                        <!-- Card Body -->
                                                        <template x-if="expandedRecId === rec.id">
                                                            <div class="p-4 border-t border-gray-200 bg-white space-y-4">
                                                                <!-- Peer Sentence Display -->
                                                                <div class="bg-gray-50 p-3 rounded border border-gray-200 space-y-1">
                                                                    <span class="text-xs text-gray-400 uppercase font-semibold block">Sentence Written by Peer:</span>
                                                                    <p class="text-gray-900 font-medium text-base" x-text="rec.sentence.text"></p>
                                                                </div>

                                                                <!-- STEP 1: Sentence Review -->
                                                                <template x-if="rec.sentence.status === 'submitted'">
                                                                    <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded space-y-2">
                                                                        <p class="text-xs font-bold text-amber-900 uppercase">Step 1: Review Peer Sentence Quality</p>
                                                                        <p class="text-xs text-amber-800">Check if it is clear, natural, and beginner-friendly before recording.</p>
                                                                        <div class="flex space-x-3 pt-1">
                                                                            <button @click="approveSentence(rec)" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs hover:bg-emerald-700 font-medium">Approve Sentence</button>
                                                                            <button @click="openRecFlagModal(rec)" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs hover:bg-red-700 font-medium">Flag Sentence as Poor Quality</button>
                                                                        </div>
                                                                    </div>
                                                                </template>

                                                                <!-- STEP 2: Record Audio -->
                                                                <template x-if="rec.sentence.status === 'approved'">
                                                                    <div class="pt-2 bg-emerald-50/40 p-4 rounded border border-emerald-100" x-data="audioRecorder(rec)">
                                                                        <p class="text-xs font-bold text-emerald-900 uppercase mb-2">Step 2: Record Audio</p>
                                                                        <div class="text-xs text-emerald-800 space-y-1 mb-3">
                                                                            <p>• Record in a quiet room with no background noise[cite: 1, 2].</p>
                                                                            <p>• Speak clearly and steadily at a natural pace[cite: 1, 2].</p>
                                                                        </div>
                                                                        <div class="flex items-center space-x-3">
                                                                            <template x-if="!recording && !audioUrl">
                                                                                <button @click="startRecording()" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs hover:bg-red-700 font-medium">🔴 Start Recording</button>
                                                                            </template>
                                                                            <template x-if="recording">
                                                                                <button @click="stopRecording()" class="bg-gray-800 text-white px-3 py-1.5 rounded text-xs animate-pulse font-medium">⏹️ Stop Recording</button>
                                                                            </template>
                                                                            <template x-if="audioUrl">
                                                                                <div class="flex items-center space-x-2 w-full">
                                                                                    <audio :src="audioUrl" controls class="h-8 flex-grow"></audio>
                                                                                    <button @click="resetRecording()" class="text-xs text-gray-600 hover:underline">Re-record</button>
                                                                                    <button @click="uploadAndComplete(rec)" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs hover:bg-indigo-700 font-medium">Upload & Submit</button>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <p x-show="recordingTasks.length === 0" class="text-gray-500 italic text-center py-6">No pending recording tasks assigned right now.</p>

                    <!-- RECORDING SENTENCE FLAG MODAL -->
                    <div x-show="flagModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4">
                            <h4 class="text-lg font-bold text-red-600">Flag Sentence as Poor Quality</h4>
                            <p class="text-sm text-gray-600">Please leave a comment explaining why this sentence is being flagged:</p>
                            <textarea x-model="flagComment" rows="3" placeholder="Enter reason for flagging..." class="w-full p-2 border rounded border-gray-300 text-sm"></textarea>
                            <div class="flex justify-end space-x-3">
                                <button @click="flagModalOpen = false; flagComment = ''" class="px-4 py-2 border rounded text-sm text-gray-600 hover:bg-gray-100">Cancel</button>
                                <button @click="submitRecFlag()" class="px-4 py-2 bg-red-600 text-white rounded text-sm hover:bg-red-700 font-medium">Submit Flag</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ADMIN: FORMS & ASSIGN TAB -->
            <template x-if="currentTab === 'admin_assign' && profile?.role === 'admin'">
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div class="bg-white p-6 rounded shadow border border-gray-200 space-y-4">
                        <h3 class="text-lg font-bold text-purple-700">Assign Unassigned Masdar & Screeve Combinations</h3>
                        <p class="text-sm text-gray-600">Review unique unassigned verb forms below, assign specific writers and recorders to each combination, and generate tasks.</p>
                        
                        <div class="space-y-4 mt-4">
                            <template x-for="combo in uniqueCombos" :key="combo.key">
                                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs uppercase bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-bold" x-text="combo.screeve"></span>
                                            <span class="text-xs text-gray-500" x-text="combo.formCount + ' form variant(s)'"></span>
                                        </div>
                                        <p class="text-base font-semibold text-gray-900" x-text="'Masdar: ' + combo.masdar"></p>
                                    </div>

                                    <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                        <!-- Writer Select -->
                                        <select x-model="combo.writerId" class="p-2 border rounded border-gray-300 text-sm w-full sm:w-44 bg-white">
                                            <option value="">Select Writer...</option>
                                            <template x-for="u in contributors" :key="u.id">
                                                <option :value="u.id" x-text="u.username"></option>
                                            </template>
                                        </select>

                                        <!-- Recorder Select -->
                                        <select x-model="combo.recorderId" class="p-2 border rounded border-gray-300 text-sm w-full sm:w-44 bg-white">
                                            <option value="">Select Recorder...</option>
                                            <template x-for="u in contributors" :key="u.id">
                                                <option :value="u.id" x-text="u.username"></option>
                                            </template>
                                        </select>

                                        <!-- Assign Button -->
                                        <button @click="assignCombo(combo)" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700 font-medium whitespace-nowrap w-full sm:w-auto">Assign Combo</button>
                                    </div>
                                </div>
                            </template>
                            <p x-show="uniqueCombos.length === 0" class="text-gray-500 italic text-center py-4">No unassigned forms available right now.</p>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ADMIN: REVIEW RECORDINGS TAB -->
            <template x-if="currentTab === 'admin_review_audio' && profile?.role === 'admin'">
                <div class="space-y-6">
                    <h3 class="text-lg font-bold text-purple-700">Recordings Pending Admin Review</h3>
                    <template x-for="rec in adminRecordings" :key="rec.id">
                        <div class="bg-white p-5 rounded shadow border border-gray-200 space-y-4">
                            <div>
                                <p class="text-xs text-gray-500 uppercase">Masdar: <strong x-text="rec.sentences.forms.masdar"></strong> | Screeve: <strong x-text="rec.sentences.forms.screeve"></strong></p>
                                <p class="text-md font-semibold text-gray-900 mt-1" x-text="'Sentence: ' + rec.sentences.text"></p>
                            </div>
                            <div>
                                <audio :src="supabaseStorageUrl(rec.audio_path)" controls class="h-10 w-full"></audio>
                            </div>
                            <div class="flex space-x-3 pt-2">
                                <button @click="adminApproveRecording(rec.id)" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm hover:bg-emerald-700 font-medium">Approve Recording</button>
                                <button @click="adminFlagRecording(rec.id)" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm hover:bg-red-700 font-medium">Flag Recording</button>
                            </div>
                        </div>
                    </template>
                    <p x-show="adminRecordings.length === 0" class="text-gray-500 italic">No recordings pending review.</p>
                </div>
            </template>

            <!-- ADMIN: FLAG DASHBOARD TAB -->
            <template x-if="currentTab === 'admin_flags' && profile?.role === 'admin'">
                <div class="space-y-6">
                    <h3 class="text-lg font-bold text-red-600">Flagged Items Dashboard</h3>
                    <p class="text-sm text-gray-600">Review items flagged by contributors for corrections.</p>
                    <div class="space-y-4">
                        <template x-for="flag in adminFlags" :key="flag.id">
                            <div class="bg-white p-4 rounded shadow border border-red-200 space-y-2">
                                <span class="text-xs uppercase bg-red-100 text-red-800 px-2 py-0.5 rounded font-bold" x-text="flag.type"></span>
                                <p class="text-sm text-gray-800" x-text="flag.detail"></p>
                                <p class="text-xs text-red-500 italic" x-text="'Comment: ' + (flag.comment || 'None')"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

        </div>
        </template>

    </main>

    <script>
        const SUPABASE_URL = 'https://ygxwvmhdpqbumstoqayg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_F05L1QI1ClkusTzEaBzoyQ_3YcYAaOn';
        
        window.supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const db = window.supabaseClient;

        const pronounOrder = ['მე', 'ჩვენ', 'შენ', 'თქვენ', 'ის', 'მას', 'მან', 'ისინი', 'მათ'];
        const screeveOrder = ['present', 'imperfect', 'future', 'conditional', 'aorist', 'optative', 'perfective'];

        function getPronounRank(val) {
            if (!val) return 99; // put empty/null at the end
            const index = pronounOrder.indexOf(val.trim());
            return index !== -1 ? index : 50; // unlisted items go in the middle
        }

        function getScreeveRank(screeve) {
            if (!screeve) return 99;
            const index = screeveOrder.indexOf(screeve.toLowerCase().trim());
            return index !== -1 ? index : 50;
        }

        function app() {
            return {
                user: null,
                profile: null,
                currentTab: 'stats',
                email: '',
                password: '',
                errorMessage: '',
                writingTasks: [],
                recordingTasks: [],
                contributors: [],
                uniqueCombos: [],
                bulkWriterId: '',
                bulkRecorderId: '',
                adminRecordings: [],
                adminFlags: [],
                stats: { writtenCount: 0, recordedCount: 0 },
                newForm: { masdar: '', screeve: '', form: '', subject: '', object: '' },


                async init() {
                    // Listen to auth state changes. Supabase fires an initial event on load, 
                    // so you don't need a separate getSession() call beforehand.
                    db.auth.onAuthStateChange(async (event, session) => {
                        const newUser = session?.user || null;
                        
                        // Only re-fetch if user state actually changed or initialized for the first time
                        if (newUser?.id !== this.user?.id) {
                            this.user = newUser;
                            if (this.user) {
                                await this.fetchProfile();
                                await this.fetchTasks();
                            } else {
                                this.profile = null;
                                this.writingTasks = [];
                                this.recordingTasks = [];
                            }
                        }
                    });
                },

                async fetchProfile() {
                    const { data } = await db.from('users').select('*').eq('id', this.user.id).single();
                    this.profile = data;
                },

                async login() {
                    this.errorMessage = '';
                    const { error } = await db.auth.signInWithPassword({ email: this.email, password: this.password });
                    if (error) this.errorMessage = error.message;
                },

                async logout() {
                    await db.auth.signOut();
                    this.user = null;
                    this.profile = null;
                },

                async fetchTasks() {
                    const { data: wData } = await db
                        .from('sentences')
                        .select(`id, status, form_id, forms (id, masdar, screeve, subject, object, form, status, reviewer, comment)`)
                        .eq('creator', this.user.id)
                        .eq('status', 'assigned');
                    
                    // Group by Masdar -> Screeve -> Specific Form
                    const masdarMap = {};
                    (wData || []).forEach(row => {
                        const f = row.forms;
                        if (!f) return;
                        
                        const masdar = f.masdar;
                        const screeve = f.screeve;

                        if (!masdarMap[masdar]) {
                            masdarMap[masdar] = { masdar: masdar, screevesMap: {} };
                        }
                        if (!masdarMap[masdar].screevesMap[screeve]) {
                            masdarMap[masdar].screevesMap[screeve] = { screeve: screeve, formsMap: {} };
                        }

                        // Use form.id as the key to group sentence rows under each unique form variant
                        const formKey = f.id;
                        if (!masdarMap[masdar].screevesMap[screeve].formsMap[formKey]) {
                            masdarMap[masdar].screevesMap[screeve].formsMap[formKey] = {
                                formObj: f,
                                sentences: []
                            };
                        }
                        masdarMap[masdar].screevesMap[screeve].formsMap[formKey].sentences.push({
                            id: row.id,
                            form_id: row.form_id
                        });
                    });

                    // Convert nested maps into sorted arrays
                    this.writingTasks = Object.values(masdarMap).sort((a, b) => a.masdar.localeCompare(b.masdar)).map(m => {
                        const screevesList = Object.values(m.screevesMap).sort((a, b) => {
                            return getScreeveRank(a.screeve) - getScreeveRank(b.screeve);
                        }).map(s => {
                            const formsList = Object.values(s.formsMap).sort((fa, fb) => {
                                // Sort by subject rank first, then object rank
                                const subjDiff = getPronounRank(fa.formObj.subject) - getPronounRank(fb.formObj.subject);
                                if (subjDiff !== 0) return subjDiff;
                                return getPronounRank(fa.formObj.object) - getPronounRank(fb.formObj.object);
                            });
                            return { screeve: s.screeve, forms: formsList };
                        });
                        return { masdar: m.masdar, screeves: screevesList };
                    });

                    // 2. Fetch recording tasks and group hierarchically
                    const { data: rData } = await db
                        .from('recordings')
                        .select(`id, status, sentence_id, sentences (id, text, status, reviewer, comment, forms (id, masdar, screeve, subject, object, form))`)
                        .eq('creator', this.user.id)
                        .eq('status', 'assigned');

                    const recMasdarMap = {};
                    (rData || []).forEach(row => {
                        const s = row.sentences;
                        if (!s || !s.forms) return;
                        const f = s.forms;
                        
                        const masdar = f.masdar;
                        const screeve = f.screeve;

                        if (!recMasdarMap[masdar]) {
                            recMasdarMap[masdar] = { masdar: masdar, screevesMap: {} };
                        }
                        if (!recMasdarMap[masdar].screevesMap[screeve]) {
                            recMasdarMap[masdar].screevesMap[screeve] = { screeve: screeve, formsMap: {} };
                        }

                        const formKey = f.id;
                        if (!recMasdarMap[masdar].screevesMap[screeve].formsMap[formKey]) {
                            recMasdarMap[masdar].screevesMap[screeve].formsMap[formKey] = {
                                formObj: f,
                                recordings: []
                            };
                        }
                        // Each recording task maps to a specific sentence entry
                        recMasdarMap[masdar].screevesMap[screeve].formsMap[formKey].recordings.push({
                            id: row.id,
                            status: row.status,
                            sentence: s,
                            sentenceComment: ''
                        });
                    });

                    this.recordingTasks = Object.values(recMasdarMap).sort((a, b) => a.masdar.localeCompare(b.masdar)).map(m => {
                        const screevesList = Object.values(m.screevesMap).sort((a, b) => {
                            return getScreeveRank(a.screeve) - getScreeveRank(b.screeve);
                        }).map(s => {
                            const formsList = Object.values(s.formsMap).sort((fa, fb) => {
                                const subjDiff = getPronounRank(fa.formObj.subject) - getPronounRank(fb.formObj.subject);
                                if (subjDiff !== 0) return subjDiff;
                                return getPronounRank(fa.formObj.object) - getPronounRank(fb.formObj.object);
                            });
                            return { screeve: s.screeve, forms: formsList };
                        });
                        return { masdar: m.masdar, screeves: screevesList };
                    });
                },

                async fetchStats() {
                    const { count: wCount } = await db.from('sentences').select('*', { count: 'exact', head: true }).eq('creator', this.user.id).eq('status', 'submitted');
                    const { count: rCount } = await db.from('recordings').select('*', { count: 'exact', head: true }).eq('creator', this.user.id).eq('status', 'submitted');
                    this.stats.writtenCount = wCount || 0;
                    this.stats.recordedCount = rCount || 0;
                },

                // --- WRITER ACTIONS ---
                async approveForm(formObj) {
                    const { error } = await db.from('forms').update({ 
                        status: 'approved', 
                        reviewer: this.user.id 
                    }).eq('id', formObj.id);

                    if (error) { alert(error.message); return; }
                    formObj.status = 'approved';
                    alert('Form approved successfully! You can now write your example sentences.');
                },

                openFlagModal(formObj) {
                    this.activeFormObj = formObj;
                    this.flagComment = '';
                    this.flagModalOpen = true;
                },

                async submitFlagForm() {
                    if (!this.flagComment.trim()) return alert('Please enter a comment for flagging.');
                    const formObj = this.activeFormObj;
                    
                    const { error } = await db.from('forms').update({ 
                        status: 'flagged', 
                        reviewer: this.user.id, 
                        comment: this.flagComment 
                    }).eq('id', formObj.id);

                    if (error) { alert(error.message); return; }
                    
                    formObj.status = 'flagged';
                    this.flagModalOpen = false;
                    this.activeFormObj = null;
                    this.flagComment = '';
                    alert('Form flagged successfully.');
                },

                async submitSentences(item) {
                    const formId = item.formObj.id;
                    const ex1 = (this.exampleInputs[formId + '_0'] || '').trim();
                    const ex2 = (this.exampleInputs[formId + '_1'] || '').trim();
                    const ex3 = (this.exampleInputs[formId + '_2'] || '').trim();

                    if (!ex1 || !ex2 || !ex3) {
                        return alert('Please fill in all 3 example sentences.');
                    }

                    const targetForm = item.formObj.form;
                    const punctuationRegex = /[.!?]$/;
                    const inputs = [ex1, ex2, ex3];

                    for (let i = 0; i < inputs.length; i++) {
                        const s = inputs[i];
                        if (!s.includes(targetForm)) {
                            return alert(`Example ${i + 1} does not contain the target form: "${targetForm}"`);
                        }
                        if (!punctuationRegex.test(s)) {
                            return alert(`Example ${i + 1} must end with a punctuation mark (. ! ?).`);
                        }
                    }

                    if (!item.sentences || item.sentences.length < 3) {
                        return alert('Error: Expected 3 sentence task rows for this form.');
                    }

                    // Update each of the 3 sentence rows linked to this form.id
                    for (let i = 0; i < 3; i++) {
                        const sentenceRow = item.sentences[i];
                        const { error } = await db.from('sentences').update({
                            text: inputs[i],
                            status: 'submitted'
                        }).eq('id', sentenceRow.id);

                        if (error) {
                            alert(`Error saving sentence ${i + 1}: ${error.message}`);
                            return;
                        }
                    }

                    alert('All 3 example sentences submitted successfully!');
                    await this.fetchTasks();
                },
                // --- RECORDER ACTIONS ---
                async approveSentence(rec) {
                    const { error } = await db.from('sentences').update({ status: 'approved', reviewer: this.user.id }).eq('id', rec.sentence.id);
                    if (error) { alert(error.message); return; }
                    rec.sentence.status = 'approved';
                },

                openRecFlagModal(rec) {
                    this.activeRecObj = rec;
                    this.recFlagComment = '';
                    this.recFlagModalOpen = true;
                },

                async submitRecFlag() {
                    if (!this.recFlagComment.trim()) return alert('Please enter a comment for flagging.');
                    const rec = this.activeRecObj;

                    const { error } = await db.from('sentences').update({ 
                        status: 'flagged', 
                        reviewer: this.user.id, 
                        comment: this.recFlagComment 
                    }).eq('id', rec.sentence.id);

                    if (error) { alert(error.message); return; }

                    rec.sentence.status = 'flagged';
                    this.recFlagModalOpen = false;
                    this.activeRecObj = null;
                    this.recFlagComment = '';
                    alert('Sentence flagged as poor quality.');
                },

                // --- ADMIN ACTIONS ---
                async fetchAdminData() {
                    // Fetch contributors for dropdowns
                    const { data: uData } = await db.from('users').select('*');
                    this.contributors = uData || [];

                    // Fetch unassigned forms to build unique combinations
                    const { data: forms, error: fError } = await db.from('forms').select('id, masdar, screeve').eq('status', 'unassigned');
                    if (fError) { alert(fError.message); return; }

                    const comboMap = {};
                    (forms || []).forEach(f => {
                        const key = `${f.masdar}___${f.screeve}`;
                        if (!comboMap[key]) {
                            comboMap[key] = {
                                key: key,
                                masdar: f.masdar,
                                screeve: f.screeve,
                                formIds: [],
                                formCount: 0,
                                writerId: '',
                                recorderId: ''
                            };
                        }
                        comboMap[key].formIds.push(f.id);
                        comboMap[key].formCount++;
                    });

                    this.uniqueCombos = Object.values(comboMap);
                },

                async assignCombo(combo) {
                    if (!combo.writerId || !combo.recorderId) {
                        return alert('Please select both a writer and a recorder for this combination.');
                    }

                    let successCount = 0;
                    for (const formId of combo.formIds) {
                        const { error: fUpdateErr } = await db.from('forms').update({
                            status: 'assigned'
                        }).eq('id', formId);

                        if (fUpdateErr) {
                            console.error('Error updating form status:', fUpdateErr.message);
                            continue;
                        }

                        // 2. Generate 3 sentences and recording tasks
                        for (let i = 0; i < 3; i++) {
                            const { data: sent, error: sErr } = await db.from('sentences').insert({
                                form_id: formId,
                                creator: combo.writerId,
                                status: 'assigned'
                            }).select('id').single();

                            if (sent && !sErr) {
                                await db.from('recordings').insert({
                                    sentence_id: sent.id,
                                    creator: combo.recorderId,
                                    status: 'assigned'
                                });
                                successCount++;
                            }
                        }
                    }

                    alert(`Successfully assigned tasks for ${combo.masdar} (${combo.screeve}) and updated form statuses!`);
                    // Refresh the list of unassigned combos
                    await this.fetchAdminData();
                },

                async createForm() {
                    const { error: insErr } = await db.from('forms').insert({
                        ...this.newForm,
                        creator: this.user.id,
                        status: 'assigned'
                    });
                    if (insErr) { alert(insErr.message); return; }
                    alert('Form added successfully!');
                    this.newForm = { masdar: '', screeve: '', form: '', subject: '', object: '' };
                },

                async fetchAdminRecordings() {
                    const { data } = await db
                        .from('recordings')
                        .select(`id, audio_path, sentences (id, text, forms (masdar, screeve))`)
                        .eq('status', 'submitted');
                    this.adminRecordings = data || [];
                },

                supabaseStorageUrl(path) {
                    const { data } = db.storage.from('audio-bucket').getPublicUrl(path);
                    return data.publicUrl;
                },

                async adminApproveRecording(id) {
                    await db.from('recordings').update({ status: 'approved', reviewer: this.user.id }).eq('id', id);
                    this.fetchAdminRecordings();
                },

                async adminFlagRecording(id) {
                    await db.from('recordings').update({ status: 'flagged', reviewer: this.user.id }).eq('id', id);
                    this.fetchAdminRecordings();
                },

                async fetchAdminFlags() {
                    const { data: fForms } = await db.from('forms').select('id, masdar, screeve, comment').eq('status', 'flagged');
                    const { data: fSents } = await db.from('sentences').select('id, text, comment').eq('status', 'flagged');
                    const { data: fRecs } = await db.from('recordings').select('id, audio_path, comment').eq('status', 'flagged');

                    this.adminFlags = [
                        ...(fForms || []).map(x => ({ id: x.id, type: 'Form Flag', detail: `${x.masdar} (${x.screeve})`, comment: x.comment })),
                        ...(fSents || []).map(x => ({ id: x.id, type: 'Sentence Flag', detail: x.text, comment: x.comment })),
                        ...(fRecs || []).map(x => ({ id: x.id, type: 'Recording Flag', detail: x.audio_path, comment: x.comment }))
                    ];
                }
            }
        }

        function audioRecorder(task) {
            return {
                recording: false,
                mediaRecorder: null,
                audioChunks: [],
                audioBlob: null,
                audioUrl: null,

                async startRecording() {
                    this.audioChunks = [];
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                    this.mediaRecorder.onstop = () => {
                        this.audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                        this.audioUrl = URL.createObjectURL(this.audioBlob);
                    };
                    this.mediaRecorder.start();
                    this.recording = true;
                },

                stopRecording() {
                    this.mediaRecorder.stop();
                    this.recording = false;
                },

                resetRecording() {
                    this.audioBlob = null;
                    this.audioUrl = null;
                },

                async uploadAndComplete(task) {
                    const fileName = `${task.id}-${Date.now()}.webm`;
                    const { data, error } = await window.supabaseClient.storage.from('audio-bucket').upload(fileName, this.audioBlob);
                    if (error) { alert(error.message); return; }

                    await window.supabaseClient.from('recordings').update({
                        audio_path: data.path,
                        status: 'submitted'
                    }).eq('id', task.id);

                    alert('Audio uploaded and submitted successfully!');
                    window.location.reload();
                }
            }
        }
    </script>
